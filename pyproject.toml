[project]
name = "skilltwin"
dynamic = ["version"]
description = "Agentic AI personalized learning platform with evidence-verified skills and a Learner Twin."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.7",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "groq==1.7.0",
    "httpx==0.28.1",
    "slowapi==0.1.10",
    "itsdangerous==2.2.0",
    "pillow==13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.dynamic]
version = { attr = "backend.__version__" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle / pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # modern syntax
    "SIM", "C4", "PIE", "RET", "PERF", "FURB",  # simplicity and idioms
    "C90",          # cyclomatic complexity
    "N",            # naming
    "PL",           # pylint checks (argument counts, branches, magic values)
    "ARG",          # unused arguments
    "FBT",          # no boolean positional arguments
    "DTZ",          # timezone-aware datetimes
    "PTH",          # pathlib over os.path
    "T20",          # no print statements
    "ERA",          # no commented-out code
    "LOG", "G",     # logging hygiene
    "ASYNC",        # async correctness
    "S",            # security (bandit)
    "D102", "D103", # docstrings on public methods and functions
    "RUF",
]
ignore = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6  # keyword-only LLM call settings (agent, system, payload, model, tokens, image)

[tool.ruff.lint.per-file-ignores]
# slowapi's @limiter.limit requires a `request: Request` parameter even when unused.
"backend/api/routes/*.py" = ["ARG001"]
"tests/**" = ["S", "D", "PLR2004", "ARG", "FBT", "PLC0415"]

[tool.mypy]
strict = true
files = ["backend"]

[[tool.mypy.overrides]]
module = ["slowapi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`",
    "ignore::DeprecationWarning:slowapi.*",
]

[tool.coverage.run]
source = ["backend"]
